# [trajmc] NOT part of any official Dream suite -- Dream publishes no SVAMP
# configuration for either the Base or the Instruct model.
#
# SVAMP is scored on GSM8K's protocol, as it was for the LLaDA-Instruct table
# (utils/eval_benchmarks.py eval_svamp: "SVAMP on GSM8K's protocol").  Here that
# means the vendored gsm8k-cot.yaml -- same "Q: ... A:" prompt, same stop
# strings, same strict/flexible regexes and exact_match normalisation -- run on
# the official eval_instruct/eval.sh gsm8k_cot row (0-shot, chat template,
# max_new_tokens = diffusion_steps = 256, temperature 0.1, top_p 0.9, entropy).
#
# Items: all 1000 SVAMP problems, the 300-problem test half first, exactly the
# order utils/oc_tasks/data.py load_svamp() uses, so --limit 300 is the test
# split.  Loaded through the parquet builder because ChilleD/SVAMP's own split
# metadata rejects a merged split.  Gold answers are all integers.
task: svamp_cot
dataset_path: parquet
dataset_kwargs:
  data_files:
    test:
      - hf://datasets/ChilleD/SVAMP/data/test-00000-of-00001.parquet
      - hf://datasets/ChilleD/SVAMP/data/train-00000-of-00001.parquet
output_type: generate_until
test_split: test
doc_to_text: "Q: {{Body.strip()}} {{Question.strip()}}\nA:"
doc_to_target: "{{Answer|float|int}}"
filter_list:
- filter:
  - function: regex
    regex_pattern: The answer is (\-?[0-9\.\,]+).
  - function: take_first
  name: strict-match
- filter:
  - function: regex
    group_select: -1
    regex_pattern: (-?[$0-9.,]{2,})|(-?[0-9]+)
  - function: take_first
  name: flexible-extract
generation_kwargs:
  do_sample: false
  until:
  - 'Q:'
  - </s>
  - <|im_end|>
metric_list:
- aggregation: mean
  higher_is_better: true
  ignore_case: true
  ignore_punctuation: false
  metric: exact_match
  regexes_to_ignore:
  - ','
  - \$
  - '(?s).*#### '
  - \.$
num_fewshot: 0
metadata:
  version: 1.0
