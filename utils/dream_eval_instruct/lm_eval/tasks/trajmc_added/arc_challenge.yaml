# [trajmc] NOT part of the official Dream *Instruct* suite; same situation and
# same resolution as trajmc_added/hellaswag and piqa.yaml.  Dream publishes
# ARC-Challenge only for the BASE model, in eval/eval_dream_mc.sh (0-shot,
# batch_size 32, add_bos_token=true, conditional likelihood, NO chat template),
# so that protocol is used verbatim.  The yaml is upstream
# lm-evaluation-harness 0.4.8's arc_easy.yaml + arc_challenge.yaml, flattened
# into one file because the fork ships no arc/ directory to include from.
tag:
  - ai2_arc
task: arc_challenge
dataset_path: allenai/ai2_arc
dataset_name: ARC-Challenge
output_type: multiple_choice
training_split: train
validation_split: validation
test_split: test
doc_to_text: "Question: {{question}}\nAnswer:"
doc_to_target: "{{choices.label.index(answerKey)}}"
doc_to_choice: "{{choices.text}}"
should_decontaminate: true
doc_to_decontamination_query: "Question: {{question}}\nAnswer:"
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
