[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traj-mc"
version = "0.1.0"
description = "Trajectory-aware low-rank compression of diffusion language models (Traj-MC)"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "datasets>=2.19",
  "numpy>=1.24",
  "torch>=2.1",
  "transformers>=4.49",
]

[project.optional-dependencies]
eval = [
  "accelerate>=0.34",
  "huggingface_hub",
  "latex2sympy2",
  "pandas",
  "sympy",
  "tqdm>=4.66",
]
test = ["pytest>=8"]

[project.scripts]
trajmc-calibrate = "trajmc.calibration:main"
trajmc-compress = "trajmc.compression:main"

[tool.setuptools.packages.find]
include = ["trajmc*"]
